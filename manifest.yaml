id: bundled
version: 0.1.0

tools:
  # ---- memory / history / file / vision (from memory-extension) ----
  - name: todo-write
    description: Replace the session's todo list (stored in the database, not a file).
    descriptions:
      zh: 替换会话的待办列表（存于数据库，而非文件）。
    input_schema:
      type: object
      properties:
        todos:
          type: array
          description: The full todo list to replace the session current one.
          descriptions:
            zh: 替换会话当前列表的完整待办列表。
          items:
            type: object
            properties:
              content:
                type: string
                description: Todo item text.
                descriptions:
                  zh: 待办项文本。
              status:
                type: string
                enum: [pending, in_progress, completed, cancelled]
                description: Todo status.
                descriptions:
                  zh: 待办状态。
              priority:
                type: string
                enum: [high, medium, low]
                description: Todo priority.
                descriptions:
                  zh: 待办优先级。
            required: [content, status, priority]
      required: [todos]

  - name: history-search
    description: >-
      Search this session's chat history by keyword (case-insensitive substring over
      parts(type=text) text, tool names and change ids), optionally constrained to a time
      range [from, to] (YYYY-MM-DD HH:MM:SS). Returns messages newest-first with their
      role, depth (0 = newest), tool name and workspace change id.
    descriptions:
      zh: >-
        按关键词搜索本会话的聊天历史（对 parts(type=text) 文本、工具名、change id 做大小写不敏感的子串匹配），可选时间范围
        [from, to]（YYYY-MM-DD HH:MM:SS）。按最新在前返回消息及其角色、深度（0=最新）、工具名与工作区 change id。
    input_schema:
      type: object
      properties:
        query:
          type: string
          description: Case-insensitive keyword matched against message text, tool names and change ids.
          descriptions:
            zh: 不区分大小写的关键词，匹配消息文本、工具名与 change id。
        from:
          type: string
          description: "Inclusive lower time bound (YYYY-MM-DD HH:MM:SS)."
          descriptions:
            zh: "含端点的下界时间（YYYY-MM-DD HH:MM:SS）。"
        to:
          type: string
          description: "Inclusive upper time bound (YYYY-MM-DD HH:MM:SS)."
          descriptions:
            zh: "含端点的上界时间（YYYY-MM-DD HH:MM:SS）。"
        limit:
          type: integer
          description: Maximum number of messages to return (default 50).
          descriptions:
            zh: 最多返回的消息数（默认 50）。
      required: [query]

  - name: history-range
    description: >-
      Read this session's chat history by position (depth) window. depth 0 = the newest
      message; positive numbers go back in time; negative numbers count from the newest side
      (-1 = newest). Returns [depth_from, depth_to) oldest-first with role, content, tool
      name and change id.
    descriptions:
      zh: >-
        按位置（深度）窗口读取本会话的聊天历史。depth 0 = 最新消息；正数向更早回溯；负数从最新一侧计数（-1 = 最新）。返回
        [depth_from, depth_to)，最旧在前，含角色、内容、工具名与 change id。
    input_schema:
      type: object
      properties:
        from:
          type: integer
          description: Starting depth offset (0 = newest message).
          descriptions:
            zh: 起始深度偏移（0 = 最新一条消息）。
        to:
          type: integer
          description: Exclusive depth bound.
          descriptions:
            zh: 不含端点的深度上界。
        limit:
          type: integer
          description: Maximum number of messages to return (default 200).
          descriptions:
            zh: 最多返回的消息数（默认 200）。

  - name: file-info
    description: >-
      Return metadata (name, mime type, size, sha256) for a previously uploaded file
      referenced as file:<code>. Use this first to learn a file's type and size before
      deciding to read or analyze it.
    descriptions:
      zh: >-
        返回以 file:<code> 引用的已上传文件元数据（名称、mime、大小、sha256）。先调用它以了解文件类型与大小，再决定读取或分析。
    input_schema:
      type: object
      properties:
        code:
          type: string
          description: "The file code (the 16-char segment after file:)."
          descriptions:
            zh: "文件编码（file: 之后的 16 字符部分）。"
      required: [code]

  - name: image-read
    description: >-
      Understand a previously uploaded image referenced as file:<code> using a vision model.
      Pass a question (prompt); the model returns a natural-language description/answer
      about the image. The image is downscaled before sending.
    descriptions:
      zh: >-
        使用视觉模型理解以 file:<code> 引用的已上传图片。传入问题（prompt）；模型返回对图片的自然语言描述/回答。发送前会先缩小图片。
    input_schema:
      type: object
      properties:
        code:
          type: string
          description: "The file code (the 16-char segment after file:)."
          descriptions:
            zh: "文件编码（file: 之后的 16 字符部分）。"
        prompt:
          type: string
          description: "Question about the image (default: describe it in detail)."
          descriptions:
            zh: 关于图像的问题（默认：详细描述该图像）。
      required: [code]
    required_config: [vlm_model]

  # ---- audio-transcribe (ASR) ----
  - name: audio-transcribe
    description: >-
      Transcribe a previously uploaded audio file referenced as file:<code> to
      text, using the configured ASR endpoint (config `asr_base_url` serving an
      OpenAI-compatible /audio/transcriptions API, e.g. the easylab gateway's
      qwen3-asr). Pass an optional language hint (ISO 639-1, e.g. zh / en).
    descriptions:
      zh: >-
        将以 file:<code> 引用的已上传音频文件转写为文字，使用配置的 ASR 端点（配置
        asr_base_url，提供 OpenAI 兼容的 /audio/transcriptions 接口，如 easylab 网关的
        qwen3-asr）。可选传语言提示（ISO 639-1，如 zh / en）。
    input_schema:
      type: object
      properties:
        code:
          type: string
          description: "The file code (the 16-char segment after file:) of the audio file."
          descriptions:
            zh: "音频文件的文件编码（file: 之后的 16 字符部分）。"
        language:
          type: string
          description: "Optional language hint (ISO 639-1, e.g. zh, en). Omit for auto."
          descriptions:
            zh: "可选语言提示（ISO 639-1，如 zh、en）。留空自动检测。"
      required: [code]
    required_config: [asr_base_url]

  # ---- web-fetch ----
  - name: web-fetch
    description: >-
      Fetch content from an HTTP or HTTPS URL and return it as text, markdown, or HTML.
      Markdown is the default. Use a more targeted tool when one is available. This tool is
      read-only. Large text results may be replaced with a preview while the complete output
      is retained in managed storage.
    descriptions:
      zh: >-
        从 HTTP 或 HTTPS URL 获取内容，以文本、markdown 或 html 返回；默认 markdown。有更精确的工具时请优先使用。本工具只读；
        过大的文本结果可能以预览返回，完整输出保留在托管存储中。
    input_schema:
      type: object
      properties:
        url:
          type: string
          description: The HTTP or HTTPS URL to fetch content from.
          descriptions:
            zh: 要获取内容的 HTTP 或 HTTPS URL。
        format:
          type: string
          enum: [text, markdown, html]
          description: The format to return the content in. Defaults to markdown.
          descriptions:
            zh: 返回内容的格式。默认 markdown。
        timeout:
          type: number
          description: Optional timeout in seconds (maximum 120).
          descriptions:
            zh: 可选超时秒数（最大 120）。
      required: [url]

  # ---- brave-search ----
  - name: brave-search
    description: >-
      Search the web using the session's Brave Search provider. Use this for current
      information beyond knowledge cutoff. This is a provider-independent local tool backed
      by the Brave Search API. The current year is 2026; use this year when searching for
      recent information or current events.
    descriptions:
      zh: >-
        使用本会话的 Brave 搜索服务搜索网页。用于获取超出知识截止时间的最新信息。这是一个基于 Brave Search API、
        与提供商无关的本地工具。当前年份为 2026，搜索近期信息或时事时请使用此年份。
    input_schema:
      type: object
      properties:
        query:
          type: string
          description: Web search query.
          descriptions:
            zh: 网页搜索关键词。
        count:
          type: integer
          minimum: 1
          maximum: 20
          description: Number of search results to return (default 8, maximum 20).
          descriptions:
            zh: 返回的搜索结果条数（默认 8，最大 20）。
      required: [query]
    required_config: [brave_api_key]

  # ---- image-generate / image-edit ----
  - name: image-generate
    description: >-
      Generate an image from a natural-language prompt using the configured image
      model (config `image_model`, a provider_id/model_id registered on the agent
      with capability=image). The result is stored and referenced as file:<code>.
    descriptions:
      zh: >-
        使用已配置的图像模型（配置 image_model，为 agent 上注册的 capability=image 的
        provider_id/model_id）根据自然语言提示生成图像。结果会存储为 file:<code>。
    input_schema:
      type: object
      properties:
        prompt:
          type: string
          description: The prompt that should be used to generate the image.
          descriptions:
            zh: 用于生成图像的提示词。
        size:
          type: string
          description: "Size of the image to generate (format `{width}x{height}`)."
          descriptions:
            zh: "生成图像的尺寸（格式 `{宽度}x{高度}`）。"
        n:
          type: integer
          description: Number of images to generate (default 1).
          descriptions:
            zh: 生成的图像数量（默认 1）。
      required: [prompt]
    required_config: [image_model]

  - name: image-edit
    description: >-
      Edit an image (referenced by file:<code>) using the configured image-edit
      model (config `image_edit_model`, a provider_id/model_id with
      capability=image), given a natural-language instruction. The result is
      stored and referenced as file:<code>.
    descriptions:
      zh: >-
        使用已配置的图像编辑模型（配置 image_edit_model，capability=image 的
        provider_id/model_id）编辑以 file:<code> 引用的图像，给定一条自然语言指令。
        结果会存储为 file:<code>。
    input_schema:
      type: object
      properties:
        code:
          type: string
          description: "The file code (the 16-char segment after file:) of the source image."
          descriptions:
            zh: "源图像的文件编码（file: 之后的 16 字符部分）。"
        prompt:
          type: string
          description: The edit instruction to apply to the image.
          descriptions:
            zh: 应用到图像的编辑指令。
      required: [code, prompt]
    required_config: [image_edit_model]

  - name: video-generate
    description: >-
      Generate a short video from a natural-language prompt using the configured
      video model (config `video_model`, a provider_id/model_id registered on the
      agent with capability=video, e.g. Google Veo). The result is stored and
      referenced as file:<code>.
    descriptions:
      zh: >-
        使用已配置的视频模型（配置 video_model，为 agent 上注册的 capability=video 的
        provider_id/model_id，如 Google Veo）根据自然语言提示生成短视频。结果会存储为 file:<code>。
    input_schema:
      type: object
      properties:
        prompt:
          type: string
          description: The prompt that should be used to generate the video.
          descriptions:
            zh: 用于生成视频的提示词。
        aspect_ratio:
          type: string
          enum: ['16:9', '9:16']
          description: Aspect ratio of the video (default provider-specific).
          descriptions:
            zh: 视频宽高比（默认由提供商决定）。
        resolution:
          type: string
          enum: ['720p', '1080p']
          description: Resolution of the video.
          descriptions:
            zh: 视频分辨率。
      required: [prompt]
    required_config: [video_model]

  - name: tts-generate
    description: >-
      Synthesize speech audio from text using the configured TTS model (config
      `tts_model`, a provider_id/model_id registered on the agent with
      capability=speech). The result is stored and referenced as file:<code>.
    descriptions:
      zh: >-
        使用已配置的语音合成模型（配置 tts_model，为 agent 上注册的 capability=speech 的
        provider_id/model_id）把文本合成为语音。结果会存储为 file:<code>。
    input_schema:
      type: object
      properties:
        text:
          type: string
          description: The text to synthesize.
          descriptions:
            zh: 要合成为语音的文本。
        voice:
          type: string
          description: Optional voice id (provider-specific).
          descriptions:
            zh: 可选的音色 id（由提供商定义）。
      required: [text]
    required_config: [tts_model]

config:
  - name: asr_base_url
    description: >-
      Base URL of an OpenAI-compatible ASR endpoint (…/v1, serving
      POST /audio/transcriptions), e.g. the easylab gateway.
    descriptions:
      zh: "OpenAI 兼容 ASR 端点的基础地址（…/v1，提供 POST /audio/transcriptions），如 easylab 网关。"
    type: string
    scope: global
    default: ''
  - name: asr_model
    description: "ASR model id (default qwen3-asr)."
    descriptions:
      zh: "ASR 模型 id（默认 qwen3-asr）。"
    type: string
    scope: global
    default: ''
  - name: asr_api_key
    description: "Optional bearer token for the ASR endpoint (EMPTY when the gateway needs no key)."
    descriptions:
      zh: "ASR 端点的可选 Bearer 令牌（网关无需密钥时填 EMPTY）。"
    type: string
    scope: global
    default: ''
  - name: vlm_model
    description: Vision model ref (provider_id/model_id) used by image-read.
    descriptions:
      zh: "image-read 使用的视觉模型引用（provider_id/model_id）。"
    type: string
    scope: global
    default: ''
  - name: image_model
    description: >-
      Image model ref (provider_id/model_id, capability=image) used by
      image-generate. Register the model on the agent first.
    descriptions:
      zh: >-
        image-generate 使用的图像模型引用（provider_id/model_id，capability=image）。
        请先在 agent 上注册该模型。
    type: string
    scope: global
    default: ''
  - name: image_edit_model
    description: >-
      Image model ref (provider_id/model_id, capability=image) used by
      image-edit. Register the model on the agent first.
    descriptions:
      zh: >-
        image-edit 使用的图像模型引用（provider_id/model_id，capability=image）。
        请先在 agent 上注册该模型。
    type: string
    scope: global
    default: ''
  - name: video_model
    description: >-
      Video model ref (provider_id/model_id, capability=video) used by
      video-generate. Register the model on the agent first.
    descriptions:
      zh: >-
        video-generate 使用的视频模型引用（provider_id/model_id，capability=video）。
        请先在 agent 上注册该模型。
    type: string
    scope: global
    default: ''
  - name: tts_model
    description: >-
      Speech model ref (provider_id/model_id, capability=speech) used by
      tts-generate. Register the model on the agent first.
    descriptions:
      zh: >-
        tts-generate 使用的语音模型引用（provider_id/model_id，capability=speech）。
        请先在 agent 上注册该模型。
    type: string
    scope: global
    default: ''
  - name: brave_api_key
    description: Brave Search API key (X-Subscription-Token) for brave-search.
    descriptions:
      zh: "brave-search 使用的 Brave Search API 密钥（X-Subscription-Token）。"
    type: string
    scope: global
    default: ''
